<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="/css/default-theme-motadata.css">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <title>IPAM Login</title>
</head>

<body class="login">

<span id="notification"></span>
<div class="login-main-panel">
    <div class="login-box-panel">
        <div class="login-title-main">
            <h1>IP Address Manager</h1>
        </div>
        <div class="login-middle-panel">
            <div class="logo-brand-login">
                <img src="/images/logo.png">
            </div>
            <div id="loginContainer">
                <form name="sentMessage" action="/loginUser.html" method="post" id="loginForm">
                    <div class="login-header">Sign In</div>
                    <div class="msg error-msg" id="loginErrorMsg" style="color: red; margin-bottom: 10px; font-weight: bold;"></div>
                    <div class="row control-group">
                        <div class="form-group col-xs-12 floating-label-form-group controls">
                            <label>Username</label>
                            <input type="text" class="form-control" placeholder="User name" id="userName" name="userName" required validationMessage="User Name is required">
                            <p class="help-block text-danger"></p>
                        </div>
                    </div>
                    <div class="row control-group">
                        <div class="form-group col-xs-12 floating-label-form-group controls">
                            <label>Password</label>
                            <input type="password" class="form-control" placeholder="Password" id="password" name="password" required validationMessage="Password is required">
                            <p class="help-block text-danger"></p>
                            <i class="fa fa-eye" id="showPassword"></i>
                        </div>
                    </div>
                    <div class="row control-group">
                        <div class="form-group col-xs-12 floating-label-form-group controls">
                            <a class="forgot-password" id="forgetPassword">Forgot Password?</a>
                        </div>
                    </div>
                    <div id="success"></div>
                    <div class="row">
                        <div class="form-group col-xs-6 reminder-me">
                            <input type="checkbox" id="remember" name="remember" class="k-checkbox">
                            <label class="k-checkbox-label" for="remember">Remember me</label>
                        </div>
                        <div class="form-group col-xs-6 align-right margin-t-10">
                            <button type="submit" class="k-button k-button-icontext k-primary k-grid-update float-r margin-0" style="margin: 0">Sign In</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="login-footer-copy">
            <b>Powered by Motadata</b>
        </div>
    </div>
</div>

<script type="text/javascript" src="/js/plugins/jquery-2.1.1.min.js"></script>
<script type="text/javascript" src="/js/plugins/kendo.all.min.js"></script>
<script type="text/javascript" src="/js/materialPreloader.js"></script>
<script type="text/javascript" src="/js/SmartNotification.min.js"></script>
<script type="text/javascript" src="/js/loader.js"></script>

<script type="text/javascript" src="/js/motadata/login.js"></script>
<script type="text/javascript" src="/js/motadata/flux.js"></script>
<script type="text/javascript" src="/js/motadata/app.js"></script>
<script type="text/javascript" src="/js/motadata/navigation.js"></script>
<script type="text/javascript" src="/js/motadata/form.js"></script>
<script type="text/javascript" src="/js/motadata/notification.js"></script>

<script type="text/javascript">
    $(document).ready(function () {
        login.init();
        var urlParams = new URLSearchParams(window.location.search);
        var errorMsg = urlParams.get('error');
        if (errorMsg) {
            $('#loginErrorMsg').text(decodeURIComponent(errorMsg));
        }
        $('#userName, #password').on('input', function() {
            $('#loginErrorMsg').text('');
        });
    });
</script>
</body>
</html>
